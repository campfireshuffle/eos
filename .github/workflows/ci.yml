name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Components must use the cn from @workspace/ui/lib/utils, which knows Eos's text-* sizes.
      # The stock "cn" treats text-body as a colour and drops colour classes like text-primary-foreground.
      - name: No stock cn imports
        run: "! grep -rn 'from \"cn\"' packages/ui/src apps/web/src"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
