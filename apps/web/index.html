<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <title>Eos · Local-first Mermaid editor</title>
    <meta
      name="description"
      content="A local-first Mermaid editor your agents can use too. Instant Pele rendering, stored in your browser, every action exposed as a WebMCP tool."
    />
    <link rel="canonical" href="https://eos.lil.run/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eos" />
    <meta property="og:title" content="Eos · Local-first Mermaid editor" />
    <meta
      property="og:description"
      content="A local-first Mermaid editor your agents can use too. Instant Pele rendering, stored in your browser, every action exposed as a WebMCP tool."
    />
    <meta property="og:url" content="https://eos.lil.run/" />
    <meta property="og:image" content="https://eos.lil.run/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The Eos editor with Mermaid source beside a rendered flowchart" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved light/dark mode before first paint.
      try {
        var m = localStorage.getItem("eos-theme-mode") || "system"
        if (m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
